ipFamilyPolicy: RequireDualStack
ipFamilies:
  - IPv6
  - IPv4
adminUser: admin
adminPassword: admin

service:
  type: LoadBalancer

fullnameOverride: grafana

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
