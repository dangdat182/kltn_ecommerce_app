adminUser: admin
adminPassword: admin

service:
  type: LoadBalancer

# Ghi lại để dễ nhớ pod/service
fullnameOverride: grafana

# Mở dashboard import Prometheus mặc định nếu cần
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
